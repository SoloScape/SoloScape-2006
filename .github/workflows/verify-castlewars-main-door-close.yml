name: Verify Castle Wars main door open and close
on:
  push:
    branches:
      - fix/castlewars-main-doors-close-after-opening
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/model/gameplay/castlewars/CastleWarsEngineeringManager.java'
      - 'Server/src/main/java/com/rs2/model/interaction/FirstObjectActionTask.java'
      - 'Server/src/test/java/CastleWarsMainDoorInteractionChecks.java'
      - '.github/workflows/verify-castlewars-main-door-close.yml'
  workflow_dispatch:
jobs:
  main-door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile server and check Castle Wars large-door interactions
        working-directory: Server
        run: |
          mkdir -p castlewars-main-door-test-classes
          find src/main/java -name '*.java' > /tmp/castlewars-main-door-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d castlewars-main-door-test-classes @/tmp/castlewars-main-door-sources.txt
          javac -encoding UTF-8 -cp 'castlewars-main-door-test-classes:lib/*' -d castlewars-main-door-test-classes src/test/java/CastleWarsMainDoorInteractionChecks.java
          java -cp 'castlewars-main-door-test-classes:lib/*' CastleWarsMainDoorInteractionChecks
