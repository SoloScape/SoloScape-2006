name: Verify Clue Merchant Command
on:
  push:
    branches: [main]
    paths:
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/test/java/ClueMerchantCommandChecks.java'
      - '.github/workflows/verify-clue-merchant-command.yml'
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/test/java/ClueMerchantCommandChecks.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clue-merchant-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile server and verify merchant command
        working-directory: Server
        run: |
          mkdir -p /tmp/clue-merchant-classes
          find src/main/java -name '*.java' > /tmp/clue-merchant-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d /tmp/clue-merchant-classes @/tmp/clue-merchant-sources.txt
          javac -encoding UTF-8 -cp '/tmp/clue-merchant-classes:lib/*' -d /tmp/clue-merchant-classes src/test/java/ClueMerchantCommandChecks.java
          java -Djava.awt.headless=true -cp '/tmp/clue-merchant-classes:lib/*' ClueMerchantCommandChecks
