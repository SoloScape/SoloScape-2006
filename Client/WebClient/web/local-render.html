<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>SoloScape</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: black; }
    body { display: flex; justify-content: center; }
    #display { max-width: 100%; overflow-x: auto; background: black; }
  </style>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <script src="local-render-bridge.js"></script>
</head>
<body>
<div id="display"></div>
<script>
(async () => {
  'use strict';
  try {
    if (typeof cheerpjInit !== 'function') {
      throw new Error('CheerpJ runtime did not load. Check access to its CDN.');
    }
    await cheerpjInit({
      version: 8,
      status: 'default',
      natives: window.localRenderSocketNatives,
      javaProperties: [
        'client.host=127.0.0.1', // Only used to parse a host; no browser-loopback TCP.
        'client.port=43594',
        'client.transport=lan-websocket'
      ]
    });
    cheerpjCreateDisplay(765, 503, document.getElementById('display'));
    const exitCode = await cheerpjRunMain(
      'unpackaged.BrowserClientBootstrap',
      '/app/client.jar',
      '1', 'local', 'live', 'highmem', 'members', 'english'
    );
    console.info('[local-render] Java client exited with code ' + exitCode);
  } catch (error) {
    console.error('[local-render] Startup failed:', error);
  }
})();
</script>
</body>
</html>
